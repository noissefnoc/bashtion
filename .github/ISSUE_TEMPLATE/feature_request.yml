name: "Feature Request"
description: "Suggest a new idea, mutation operator, or workflow enhancement for bashtion."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas and operator suggestions for Bash 5.x and bats-core testing!

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Motivation"
      description: "Is your feature request related to a specific testing gap or workflow limitation?"
      placeholder: "Currently, bashtion does not mutate ..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the desired behavior, new operator ID, or CLI option."
      placeholder: "Add an operator for ... that transforms Original -> Mutated."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Have you considered any alternative workarounds or tools?"
    validations:
      required: false
