version: 2

project_name: bashtion

builds:
  - id: bashtion
    main: ./cmd/bashtion
    binary: bashtion
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/noissefnoc/bashtion/internal/bashtion.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - "^docs:"
      - "^test:"
  groups:
    - title: "Breaking Changes"
      regexp: '^.*!:'
      order: 0
    - title: "Dependencies"
      regexp: '^(chore|fix)\(deps\):'
      order: 3
    - title: "Features"
      regexp: '^feat(\([^)]+\))?:'
      order: 1
    - title: "Bug Fixes"
      regexp: '^fix(\([^)]+\))?:'
      order: 2
    - title: "CI & Maintenance"
      regexp: '^(ci|build|chore|refactor|perf)(\([^)]+\))?:'
      order: 4
    - title: "Other Changes"
      order: 999
